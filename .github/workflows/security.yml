name: Security
on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC
permissions:
  contents: read
  issues: write
env:
  TRUFFLEHOG_VERSION: v3.95.2
jobs:
  gitleaks:
    runs-on: ${{ vars.RUNNER_LABEL || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Resolve trusted gitleaks config for downstream repos
        # .gitleaks.toml is synced to all downstream repos. Read from the base branch so a PR cannot
        # tamper with the config to bypass scanning. Gridltd-DevOps/.github PRs use the PR-branch
        # config directly (no override) to allow rule development in this source repo.
        #
        # Bootstrap case (Gridltd-DevOps/.github#736 backfill): on the very first PR that
        # introduces both .gitleaks.toml and this workflow, the base branch lacks the file,
        # so `git show origin/<base>:.gitleaks.toml` fails. Fall back to the PR-branch copy
        # in that one-shot bootstrap case. After merge, subsequent PRs hit the normal
        # trusted-base path. Remove this fallback once sync-org-rules owns propagation.
        if: github.event_name == 'pull_request' && github.repository != 'Gridltd-DevOps/.github'
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/trusted-gitleaks-config"
          if git show "origin/${{ github.base_ref }}:.gitleaks.toml" > "${GITHUB_WORKSPACE}/trusted-gitleaks-config/.gitleaks.toml" 2>/dev/null; then
            echo "Using trusted base-branch .gitleaks.toml"
          elif [ -f .gitleaks.toml ]; then
            echo "::warning::Base branch lacks .gitleaks.toml (bootstrap case); using PR-branch copy"
            cp .gitleaks.toml "${GITHUB_WORKSPACE}/trusted-gitleaks-config/.gitleaks.toml"
          else
            echo "::error::No .gitleaks.toml available on base or PR branch"
            exit 1
          fi
          echo "GITLEAKS_CONFIG=${GITHUB_WORKSPACE}/trusted-gitleaks-config/.gitleaks.toml" >> "${GITHUB_ENV}"
      - name: Run gitleaks
        run: |
          for i in 1 2 3; do
            curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz && break
            sleep 5
          done
          tar xzf gitleaks.tar.gz
          ./gitleaks detect --source . --verbose --config "${GITLEAKS_CONFIG:-.gitleaks.toml}" --gitleaks-ignore-path .gitleaksignore
      - name: Install TruffleHog
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p "${HOME}/bin"
          TRUFFLEHOG_RELEASE_BASE="https://github.com/trufflesecurity/trufflehog/releases/download/${TRUFFLEHOG_VERSION}"
          TRUFFLEHOG_TARBALL="trufflehog_${TRUFFLEHOG_VERSION#v}_linux_amd64.tar.gz"
          TRUFFLEHOG_CHECKSUMS="trufflehog_${TRUFFLEHOG_VERSION#v}_checksums.txt"
          curl -sSfL -o "${TRUFFLEHOG_TARBALL}" "${TRUFFLEHOG_RELEASE_BASE}/${TRUFFLEHOG_TARBALL}"
          curl -sSfL -o "${TRUFFLEHOG_CHECKSUMS}" "${TRUFFLEHOG_RELEASE_BASE}/${TRUFFLEHOG_CHECKSUMS}"
          grep " ${TRUFFLEHOG_TARBALL}$" "${TRUFFLEHOG_CHECKSUMS}" > "${TRUFFLEHOG_TARBALL}.sha256"
          sha256sum -c "${TRUFFLEHOG_TARBALL}.sha256"
          tar -xzf "${TRUFFLEHOG_TARBALL}"
          chmod +x trufflehog
          mv trufflehog "${HOME}/bin/"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
      - name: Run TruffleHog
        if: github.event_name == 'pull_request'
        # `--exclude-paths .trufflehogignore` skips security-test-fixture
        # files (e.g., __tests__/outbound-guard.test.js) that intentionally
        # contain synthetic strings shaped like real secrets. Sister to
        # `.gitleaks.toml`'s `[allowlist].paths` block. The path-allowlist
        # approach is immune to commit-fingerprint rotation. Background:
        # gateway#525 / Gridltd-DevOps/.github#615.
        run: |
          if [ -f .trufflehogignore ]; then
            trufflehog filesystem . --results=verified,unknown --fail --no-update --exclude-paths=.trufflehogignore
          else
            trufflehog filesystem . --results=verified,unknown --fail --no-update
          fi
      - name: Create issue on cron failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label "security,ci-failure" --state open --json number -q 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create \
              --title "Security: gitleaks failure (weekly scan)" \
              --body "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --label "security,ci-failure"
          fi
  sanitize:
    name: Data Sanitization Check
    runs-on: ${{ vars.RUNNER_LABEL || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install detect-secrets
        run: pip install detect-secrets 2>/dev/null || pip install --break-system-packages detect-secrets
      - name: Scan for secrets (advisory)
        run: |
          detect-secrets scan --all-files --exclude-files '\.gitleaksignore|node_modules|\.lock|dist/' . > .secrets-report.json
          FINDINGS=$(python3 -c "import json; d=json.load(open('.secrets-report.json')); print(sum(len(v) for v in d.get('results',{}).values()))")
          echo "detect-secrets findings: $FINDINGS"
          if [ "$FINDINGS" -gt 0 ]; then
            echo "::warning::detect-secrets found $FINDINGS potential secrets (advisory — review recommended)"
          fi
      - name: PII check
        run: |
          HITS=$(grep -rn --include='*.ts' --include='*.js' --include='*.py' --include='*.json' -E '[0-9]{3}-[0-9]{2}-[0-9]{4}' . --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist 2>/dev/null | grep -v test | grep -v spec | grep -v mock | head -20)
          if [ -n "$HITS" ]; then
            echo "PII patterns found:"
            echo "$HITS"
            exit 1
          fi
          echo "No PII patterns detected"
